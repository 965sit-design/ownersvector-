<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="住宅会社向け商談記録ツール・ベクトルシート">
    <title>ベクトルシート</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-header no-print">
      <button type="button" class="brand" id="brand-start" aria-label="開始画面へ戻る">
        <span class="brand-logo-crop">
          <img class="brand-logo" src="logo_clr.png" alt="NEST HOUSE">
        </span>
      </button>
      <nav aria-label="メインナビゲーション">
        <button type="button" id="nav-start">開始画面</button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="app-footer no-print">
      <div>
        <strong>ブラウザ保存なし</strong>
        <span>入力内容はページを閉じると消えます。後日編集する場合は実務者用CSVを書き出してください。</span>
      </div>
      <div class="footer-actions">
        <button type="button" class="button button-danger-quiet" id="clear-data">現在の入力内容を破棄</button>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <button type="button" class="back-to-top no-print" aria-label="ページ上部へ戻る">↑ 上へ</button>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
